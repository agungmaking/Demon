<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Demon AR</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

    <div style="
        position:absolute;
        top:10px;
        width:100%;
        text-align:center;
        color:white;
        z-index:10;
        font-size:20px;
        font-family:sans-serif;">
        Arahkan Kamera ke Kartu Demon
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled:false"
        renderer="logarithmicDepthBuffer:true;"
        arjs="trackingMethod: best;
                sourceType: webcam;
                debugUIEnabled: false;">

        <a-nft
            type="nft"
            url="./nft/demon"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
            emitevents="true">

            <a-entity
                gltf-model="./model/succubus-1.glb"

                scale="15 15 15"

                position="0 -50 0"

                rotation="-90 0 0">

            </a-entity>

        </a-nft>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
